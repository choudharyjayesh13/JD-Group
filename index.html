<style>
/* Same look as the JD One sign-in screens (app.myjdgroup.com): white, ink and gold. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#17140f;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.34em;padding-left:.34em;color:#17140f}
.screen{display:none;min-height:100vh}
.screen.on{display:block}

/* Top-right: staff login */
.topbar{position:fixed;top:12px;right:12px;z-index:40;display:flex;gap:8px}
@media(min-width:640px){.topbar{top:20px;right:24px}}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid #d9d1c2;border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#17140f;transition:border-color .2s,box-shadow .2s}
.pill:hover{border-color:#c08a3a;box-shadow:0 0 0 1px #c08a3a}
.pill svg{width:15px;height:15px}

/* Animations (same as the app) */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.rise{animation:rise .7s ease both}
.pop{animation:pop .55s cubic-bezier(.2,.8,.3,1.2) both}
.ring{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,rgba(238,129,34,0) 0deg,rgba(238,129,34,.15) 120deg,#ee8122 300deg,#ffb06a 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 1.1s linear infinite}
.bar{height:100%;background:linear-gradient(90deg,#ee8122,#ffb06a);animation:fill 2.6s ease-out both}
.orbit{position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(215,170,96,.35);animation:spin 6s linear infinite;pointer-events:none}
.orbit::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#ee8122;box-shadow:0 0 14px #ee8122}
.orbit.gold::before{background:#f4d390;box-shadow:0 0 14px #d7aa60}
@media(prefers-reduced-motion:reduce){.ring,.orbit,.bar,.rise,.pop{animation:none}}

/* Line – diamond – line */
.diamond{display:flex;align-items:center;gap:12px}
.diamond i{display:block;height:1px;width:80px;background:linear-gradient(90deg,transparent,#d7aa60)}
.diamond i:last-child{background:linear-gradient(90deg,#d7aa60,transparent)}
.diamond b{display:block;width:7px;height:7px;transform:rotate(45deg);background:#d7aa60}

/* Splash */
#splash{display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:0 24px;min-height:100vh}
#splash.on{display:flex}
.logo-wrap{position:relative;width:150px;height:150px}
.logo-wrap img{display:block;width:150px;height:150px;border-radius:50%}
.loadbar{width:224px;height:2px;overflow:hidden;border-radius:2px;background:rgba(23,20,15,.06)}
.skip{min-height:44px;padding:0 16px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6b6255}
.skip:hover{color:#17140f}

/* Logo on a round plate */
.plate{display:flex;flex-shrink:0;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;transition:box-shadow .2s}
.plate.light{border:1.5px solid #d4bf96;background:#fff;box-shadow:0 3px 14px rgba(23,20,15,.10)}
.plate.dark{border:1px solid rgba(215,170,96,.45);background:#17140f}
.plate.cover{background:#ee8122}
.plate img{max-width:68%;max-height:68%;object-fit:contain}
.plate.cover img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.plate .ini{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.1em;color:#9a7128}
.circ:hover .plate,.circ:focus-visible .plate{box-shadow:0 0 0 2.5px #c08a3a}
.circ{outline:none}

/* Pages */
.page{max-width:1440px;margin:0 auto;padding:48px 20px 64px;display:flex;flex-direction:column;gap:48px}
@media(min-width:640px){.page{padding:48px 40px 64px}}
@media(max-width:639px){#group .page{padding-top:84px}}
@media(min-width:1024px){.page{padding:48px 64px 64px}}
.head{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.head .mini{position:relative;width:112px;height:112px}
.head .mini img{display:block;width:112px;height:112px;border-radius:50%}
.head .sub{display:flex;flex-direction:column;align-items:center;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Big business cards (JD Stays, CPC, Ventures) */
.card{display:flex;flex-wrap:wrap;align-items:center;gap:36px;padding:32px;border:1px solid rgba(215,170,96,.45);border-radius:22px;background:#fff;text-align:left;width:100%;transition:border-color .2s}
.card:hover{border-color:#c08a3a}
.card .orb{position:relative;margin:12px;flex-shrink:0}
.card .txt{display:flex;flex:1;min-width:240px;flex-direction:column;gap:14px}
.card .name{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(28px,3.4vw,44px);font-weight:600;text-transform:uppercase;line-height:1.15;letter-spacing:.14em}
.card .name.sm{font-size:clamp(24px,2.4vw,32px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid #d9d1c2;border-radius:999px;padding:6px 14px;font-size:13px;color:#3a332a}
.open{margin-top:4px;font-size:12px;text-transform:uppercase;letter-spacing:.24em}
.duo{display:grid;gap:28px}
@media(min-width:1000px){.duo{grid-template-columns:1fr 1fr}}
.two .card{flex-direction:column;align-items:center;text-align:center;justify-content:flex-start;padding:40px 28px 36px;gap:28px}
.two .card .txt{align-items:center;min-width:0;width:100%}
.two .card .eyebrow{padding-left:.34em!important}
.two .card .name{font-size:clamp(26px,2.6vw,38px)}
.two .chips{justify-content:center}
.plate.big{width:200px;height:200px}
@media(max-width:639px){.plate.big{width:170px;height:170px}}

/* Property / venture grids */
.back{align-self:flex-start;min-height:44px;font-size:12px;text-transform:uppercase;letter-spacing:.2em}
.back:hover{color:#6b6255}
.center{align-items:center}
.props{display:flex;flex-wrap:wrap;justify-content:center;gap:40px 36px;max-width:1180px}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.brand .bn{display:flex;flex-direction:column;align-items:center;gap:4px}
.brand .bn b{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:600;letter-spacing:.04em}
.brand .bn small{font-size:10px;text-transform:uppercase;letter-spacing:.22em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:36px 20px;width:100%}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.big-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(30px,3.6vw,48px);font-weight:600;text-transform:uppercase;line-height:1.15;letter-spacing:.18em;padding-left:.18em}
.stays-logo{display:flex;width:150px;height:150px;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid #d4bf96;background:#fff;box-shadow:0 3px 14px rgba(23,20,15,.10)}
.stays-logo img{width:62%}

/* Footer */
footer{border-top:1px solid #ece6da;padding:28px 20px 36px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:#6b6255}
footer a:hover{color:#17140f}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#17140f;color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="topbar" id="topbar" hidden>
  <a class="pill" href="https://app.myjdgroup.com/login/" title="JD One – for JD Group staff">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    Staff login
  </a>
</div>

<!-- 1. Opening: JD logo with the orange ring -->
<section id="splash" aria-label="JD Group">
  <div class="logo-wrap">
    <span class="ring" aria-hidden="true"></span>
    <img src="assets/brands/icon-512.png" alt="JD Group">
  </div>
  <div class="rise"><span class="eyebrow">of companies · Udaipur · since 1995</span></div>

      <a class="card circ pop" href="https://www.theudaisarovar.com/explore.html" style="animation-delay:.05s">

        <span class="txt">

  <footer>

<!-- 4. JD Group Companies (CPC first) -->
<section class="screen" id="ventures">
  <div class="page center" style="gap:44px;padding-top:32px">
    <button type="button" class="back" data-go="group">← JD Group</button>
    <header class="head pop">
      <div class="mini"><span class="orbit" aria-hidden="true"></span><img src="assets/brands/icon-512.png" alt="JD Group"></div>
      <h1 class="big-title">JD Group Companies</h1>
      <span class="diamond" aria-hidden="true"><i></i><b></b><i></i></span>
      <span class="eyebrow">Choose a company</span>
    </header>
    <div class="grid" id="vgrid"></div>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
// JD Group Companies: every business except the hotels, CPC first.
var VENTURES = [
  { name: "CPC", tag: "Real estate · since 1999", logo: "cpc.webp", plate: "light", href: "ventures/cpc.html" },
  { name: "BPCL Barisadri", tag: "Filling station · 1995", logo: "bpcl.webp", plate: "light", href: "ventures/bpcl-barisadri.html" },
  { name: "Pronite", tag: "Nightlife & events", logo: "pronite.webp", plate: "dark", href: "ventures/pronite.html" },
  { name: "JD Production", tag: "Artists & stages", logo: null, ini: "JDP", plate: "dark", href: "ventures/jd-production.html" },
  { name: "Illuzion", tag: "Bar & lounge", logo: "illuzion.webp", plate: "light", href: "ventures/illuzion.html" },
  { name: "Casablanca", tag: "Pool bar & kitchen", logo: "casablanca.webp", plate: "dark", href: "ventures/casablanca.html" },
  { name: "Pizzeria Locale", tag: "Pizza & grill", logo: "pizzeria.webp", plate: "light", href: "ventures/pizzeria-locale.html" },
  { name: "The Wine House", tag: "Liquor store", logo: "winehouse.webp", plate: "light", href: "ventures/wine-house.html" },
  { name: "House of Beauty", tag: "Makeover studio", logo: "hob.webp", plate: "dark", href: "ventures/house-of-beauty.html" },
  { name: "One Network", tag: "Members’ circle", logo: "onenetwork.webp", plate: "light", href: "ventures/one-network.html" },
  { name: "Stepwhere", tag: "Investment", logo: "stepwhere.webp", plate: "dark", href: "ventures/stepwhere.html" },
  { name: "Aloe E-Cell", tag: "Investment", logo: null, ini: "AE", plate: "dark", href: "ventures/aloe-e-cell.html" }
];

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function plate(b, size) {
  var inner = b.logo
    ? '<img src="assets/brands/' + b.logo + '" alt="' + esc(b.name) + ' logo">'
    : '<span class="ini" style="font-size:' + Math.round(size * 0.26) + 'px">' + esc(b.ini) + "</span>";
  return '<span class="plate ' + b.plate + '" style="width:' + size + "px;height:" + size + 'px">' + inner + "</span>";
}
function brandTile(b, size, delay) {
  var body = plate(b, size) + '<span class="bn"><b>' + esc(b.name) + "</b><small>" + esc(b.tag) + "</small></span>";
  var attrs = 'class="brand circ pop" style="animation-delay:' + delay + 's"';
  return b.href ? "<a " + attrs + ' href="' + b.href + '">' + body + "</a>" : "<button type=\"button\" " + attrs + ' data-soon="' + esc(b.name) + '">' + body + "</button>";
}

document.getElementById("venture-chips").innerHTML = VENTURES.slice(0, 4).map(function (p) { return "<span>" + esc(p.name) + "</span>"; }).join("") + "<span>+" + (VENTURES.length - 4) + " more</span>";

var vgrid = document.getElementById("vgrid");
function fillVentures() {
  var size = window.innerWidth < 640 ? 120 : 140;
  vgrid.innerHTML = VENTURES.map(function (p, i) { return brandTile(p, size, 0.06 * i); }).join("");
}

var toastT;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.classList.remove("on"); }, 2600);
}

var STAYS_URL = "https://www.theudaisarovar.com/explore.html";
var SCREENS = ["splash", "group", "ventures"];
function show(id, push) {
  SCREENS.forEach(function (s) { document.getElementById(s).classList.toggle("on", s === id); });
  document.getElementById("topbar").hidden = id === "splash";
  if (id === "ventures") fillVentures();
  if (push && id !== "splash") history.pushState({ s: id }, "", id === "group" ? location.pathname : "#" + id);
  window.scrollTo(0, 0);
}

document.addEventListener("click", function (e) {
  var go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); show(go.getAttribute("data-go"), true); return; }
  var soon = e.target.closest("[data-soon]");
  if (soon) toast(soon.getAttribute("data-soon") + " – details coming soon");
});
window.addEventListener("popstate", function () {
  var h = location.hash.replace("#", "");
  show(SCREENS.indexOf(h) > 1 ? h : "group", false);
});

// Opening: the JD logo for a moment, then the businesses. Links like #stays or #ventures open straight there.
(function start() {
  var h = location.hash.replace("#", "");
  if (h === "stays") { location.replace(STAYS_URL); return; }
  if (SCREENS.indexOf(h) > 1) { show(h, false); return; }
  var seen = false;
  try { seen = sessionStorage.getItem("jd.opened") === "1"; sessionStorage.setItem("jd.opened", "1"); } catch (err) {}
  if (seen) { show("group", false); return; }
  show("splash", false);
  setTimeout(function () { if (document.getElementById("splash").classList.contains("on")) show("group", false); }, 2800);
})();
</script>
</body>
